services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mbn_stroy
      POSTGRES_USER: mbn_stroy
      POSTGRES_PASSWORD: mbn_stroy_local_dev
    volumes:
      - mbn_stroy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbn_stroy -d mbn_stroy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mbn_stroy_pgdata:
